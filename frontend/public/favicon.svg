<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Box -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)" />
  
  <!-- Outer Glow Arc / Ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#accent)" stroke-width="16" fill="none" opacity="0.3" stroke-dasharray="700" stroke-linecap="round" />
  
  <!-- Soundwave / Pulse Rings -->
  <path d="M 330 200 A 90 90 0 0 1 330 312" stroke="#67E8F9" stroke-width="20" fill="none" stroke-linecap="round" />
  <path d="M 365 170 A 130 130 0 0 1 365 342" stroke="#38BDF8" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.75" />
  
  <!-- Phone Handset Icon -->
  <path d="M 180 165 
           C 185 155, 200 155, 210 165 
           L 225 185 
           C 232 195, 230 208, 220 215 
           L 205 225 
           C 220 255, 245 280, 275 295 
           L 285 280 
           C 292 270, 305 268, 315 275 
           L 335 290 
           C 345 300, 345 315, 335 320 
           C 305 350, 235 340, 175 280 
           C 115 220, 105 150, 135 120 
           C 140 110, 155 110, 165 120 Z" 
        fill="#FFFFFF" filter="url(#shadow)" />
        
  <!-- Autopay Success Checkmark Badge -->
  <circle cx="340" cy="340" r="54" fill="#10B981" />
  <path d="M 318 340 L 332 354 L 362 324" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>