# Docker Compose overlay for AWS VM deployment
services:
  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: always

  agent:
    restart: always

  frontend:
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: always

  dozzle:
    ports:
      - "${DOZZLE_PORT:-8888}:8080"
    restart: always

