# Docker Compose overlay for AWS VM deployment
services:
  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost}
      - DATABASE_PATH=/app/data/outcomes.db
      - CUSTOMERS_FILE=/app/data/customers.json
      - PYTHONUNBUFFERED=1
    volumes:
      - voice-agent-data:/app/data
      - ./logs:/app/data/logs
    restart: always

  agent:
    environment:
      - API_BASE_URL=http://backend:8000
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost}
      - DATABASE_PATH=/app/data/outcomes.db
      - PYTHONUNBUFFERED=1
    volumes:
      - voice-agent-data:/app/data
      - ./logs:/app/data/logs
    restart: always

  frontend:
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: always

  dozzle:
    ports:
      - "${DOZZLE_PORT:-8888}:8080"
    restart: always

